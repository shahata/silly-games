<!doctype html>
<html lang="he" ng-app="sudokuApp">
  <head>
    <title>פותר סודוקו</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="stylesheet" href="../shared/theme.css">
    <style>
      :root {
        --neon-accent: #ffe600;
      }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.js"></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <script>document.fonts.ready.then(() => document.body.classList.add('ready'))</script>
    <a class="back-home" href="../">&larr; בית</a>
    <div class="game-page" ng-controller="MainController as main">
      <span class="new-game" role="img" aria-label="התחל מחדש" ng-click="main.restart()">🔄</span>
      <div class="controls">
        <button ng-click="main.solve(true)">פתור!</button>
        <label>
          <input type="checkbox" ng-model="main.showPossibilities" id="showPossibilities">
          אפשרויות
        </label>
        <label>
          <input type="checkbox" ng-model="main.showCode" id="showCode">
          קוד
        </label>
      </div>
      <div class="grid-wrapper">
        <table>
          <tr ng-repeat="row in main.cells" ng-init="rowScope = this">
            <td ng-repeat="cell in row" style="{{main.getStyle(rowScope.$index, $index)}}">
              <input ng-model="cell.value" type="number">
              {{main.showPossibilities ? cell.possibilities : ''}}
            </td>
          </tr>
        </table>
      </div>
      <pre>{{main.showCode ? main.code : ''}}</pre>
      <div class="game-popup-overlay" ng-if="main.showPopup">
        <div class="game-popup">
          <h2>{{main.result}}</h2>
          <button class="ok-btn" ng-click="main.dismissPopup()">אישור</button>
        </div>
      </div>
    </div>
  </body>
</html>
